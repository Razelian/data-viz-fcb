<!-- Comments - are not read as part of the code. Comments are usually use to add documentation or explanation to our code. -->
<!-- ctrl + / -->
<!-- DOCTYPE html -tells our browser that the file of this document is html. -->
<!DOCTYPE html>

<!-- html block means that the codes/elements within should be read as html. -->
<html>
	<!-- head tag contains the configuration and most of the links that will be conncted to our web page. Usually, its contents are not visible to the website. -->
	<head>
		<!-- meta tags are used to add configuration or settings to our website. -->
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- title will be responsible for setting the name of the tab. -->
		<title>Twitter trending topics</title>

		<!-- CSS External Styling -->
		<!-- <link rel="stylesheet" type="text/css" href="./style.css"> -->

		<!-- ChartJS -->
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<!-- Bootstrap implementation -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	</head>

	<!-- body contains the elements that will be show to the website. -->
	<body>
		<!-- div tag serves as a container of our elements. -->
		<div class = "bg-dark p-5">
			<!-- h1 tag is used to create heading1 elements. -->
			<!-- h1-> h6 -->
			<h1 class = "text-light text-center mb-3">Trending Topics of <span id = "date"></span></h1>

			<canvas id = "myChart"></canvas>
			  
		</div>




		<!-- Script of bootstrap -->
		<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

		<!-- JavaScript  -->
		<script src = "./index.js"></script>
	</body>
</html>
